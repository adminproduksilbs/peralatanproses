<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistem Peminjaman Perlengkapan</title>
  <!-- Google Fonts: Inter untuk kesan modern -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    .main-card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      background: #ffffff;
      overflow: hidden;
      width: 100%;
      max-width: 480px;
    }
    .card-header-custom {
      background: #4f46e5;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .nav-pills .nav-link {
      border-radius: 10px;
      font-weight: 600;
      color: #4b5563;
      transition: all 0.3s ease;
    }
    .nav-pills .nav-link.active {
      background-color: #4f46e5;
      color: white;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .form-control, .form-select {
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }
    .form-control:focus, .form-select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }
    .btn-custom {
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .btn-primary-custom {
      background-color: #4f46e5;
      border: none;
      color: white;
    }
    .btn-primary-custom:hover {
      background-color: #4338ca;
    }
    .btn-success-custom {
      background-color: #10b981;
      border: none;
      color: white;
    }
    .btn-success-custom:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <!-- Header Web App -->
    <div class="card-header-custom">
      <h4 class="mb-1 fw-bold"><i class="bi bi-box-seam"></i> E-Perlengkapan Proses</h4>
      <p class="mb-0 text-white-55 small">Pencatatan Peminjaman Perlengkapan Karyawan</p>
    </div>

    <div class="p-4">
      <!-- Navigasi Menu ala Tab Kekinian -->
      <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-3">
        <li class="nav-item">
          <button class="nav-link active" id="tabPinjam" onclick="gantiTab('pinjam')">
            <i class="bi bi-arrow-up-right-circle me-1"></i> Pinjam
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tabKembali" onclick="gantiTab('kembali')">
            <i class="bi bi-arrow-down-left-circle me-1"></i> Pengembalian
          </button>
        </li>
      </ul>

      <!-- Loading State -->
      <div id="loading" class="text-center py-5">
        <div class="spinner-border text-indigo" role="status" style="color: #4f46e5;"></div>
        <p class="text-muted mt-2 small">Menyiapkan data sistem...</p>
      </div>

      <!-- FORM PEMINJAMAN -->
      <div id="formPinjam" style="display: none;">
        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary small">PILIH KARYAWAN</label>
          <select id="selectKaryawan" class="form-select" onchange="filterBarang()">
            <option value="">-- Cari Nama Karyawan --</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary small">LINI PROSES</label>
          <div class="input-group">
            <span class="input-group-text bg-light rounded-start-3"><i class="bi bi-tag"></i></span>
            <input type="text" id="txtLini" class="form-control rounded-end-3" readonly placeholder="Otomatis terdeteksi">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold text-secondary small">PILIH BARANG & NOMOR SERI</label>
          <select id="selectBarang" class="form-select">
            <option value="">-- Pilih Karyawan Terlebih Dahulu --</option>
          </select>
        </div>

        <button onclick="kirimDataPinjam()" class="btn btn-primary-custom btn-custom w-100 shadow-sm">
          <i class="bi bi-check2-circle me-1"></i> Simpan Peminjaman
        </button>
      </div>

      <!-- FORM PENGEMBALIAN -->
      <div id="formKembali" style="display: none;">
        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary small">KARYAWAN YANG MENGEMBALIKAN</label>
          <select id="selectKaryawanKembali" class="form-select" onchange="loadBarangDipinjam()">
            <option value="">-- Cari Nama Karyawan --</option>
          </select>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold text-secondary small">BARANG YANG SEDANG DIPEGANG</label>
          <select id="selectBarangDipinjam" class="form-select">
            <option value="">-- Pilih Karyawan Terlebih Dahulu --</option>
          </select>
        </div>

        <button onclick="prosesKembali()" class="btn btn-success-custom btn-custom w-100 shadow-sm">
          <i class="bi bi-arrow-counterclockwise me-1"></i> Konfirmasi Pengembalian
        </button>
      </div>

      <!-- Area Pesan / Notifikasi -->
      <div id="pesan" class="mt-3 text-center fw-semibold small"></div>
    </div>
  </div>

  <!-- JavaScript Logika Aplikasi -->
  <script>
    let globalData = {};

    window.onload = function() {
      google.script.run
        .withSuccessHandler(function(data) {
          globalData = data;
          let selectK = document.getElementById('selectKaryawan');
          let selectKK = document.getElementById('selectKaryawanKembali');
          
          data.karyawan.forEach(function(k) {
            let opt1 = document.createElement('option');
            opt1.value = k.nama;
            opt1.setAttribute('data-lini', k.lini);
            opt1.textContent = k.nama + " (" + k.lini + ")";
            selectK.appendChild(opt1);

            let opt2 = document.createElement('option');
            opt2.value = k.nama;
            opt2.textContent = k.nama + " (" + k.lini + ")";
            selectKK.appendChild(opt2);
          });

          document.getElementById('loading').style.display = 'none';
          document.getElementById('formPinjam').style.display = 'block';
        })
        .getDataAplikasi();
    };

    function gantiTab(menu) {
      if(menu === 'pinjam') {
        document.getElementById('formPinjam').style.display = 'block';
        document.getElementById('formKembali').style.display = 'none';
        document.getElementById('tabPinjam').classList.add('active');
        document.getElementById('tabKembali').classList.remove('active');
      } else {
        document.getElementById('formPinjam').style.display = 'none';
        document.getElementById('formKembali').style.display = 'block';
        document.getElementById('tabKembali').classList.add('active');
        document.getElementById('tabPinjam').classList.remove('active');
      }
      document.getElementById('pesan').innerHTML = "";
    }

    function filterBarang() {
      let selectK = document.getElementById('selectKaryawan');
      let selectedOpt = selectK.options[selectK.selectedIndex];
      let lini = selectedOpt.getAttribute('data-lini') || '';
      document.getElementById('txtLini').value = lini;

      let selectB = document.getElementById('selectBarang');
      selectB.innerHTML = '<option value="">-- Pilih Barang & Nomor Seri --</option>';

      if(lini) {
        globalData.barang.forEach(function(b) {
          if(b.lini.toLowerCase() === lini.toLowerCase()) {
            let opt = document.createElement('option');
            // Menampilkan nama barang, warna, dan nomor seri dengan jelas
            opt.value = b.nama_barang + " - " + b.warna;
            opt.textContent = b.nama_barang + " [" + b.warna + "]";
            selectB.appendChild(opt);
          }
        });
      }
    }

    function loadBarangDipinjam() {
      let namaKaryawan = document.getElementById('selectKaryawanKembali').value;
      let selectBD = document.getElementById('selectBarangDipinjam');
      selectBD.innerHTML = '<option value="">Memuat data barang...</option>';

      if(!namaKaryawan) {
        selectBD.innerHTML = '<option value="">-- Pilih Karyawan Terlebih Dahulu --</option>';
        return;
      }

      google.script.run
        .withSuccessHandler(function(list) {
          selectBD.innerHTML = '<option value="">-- Pilih Barang yang Dikembalikan --</option>';
          if(list.length === 0) {
            selectBD.innerHTML = '<option value="">Tidak ada barang aktif dipinjam</option>';
          } else {
            list.forEach(function(item) {
              let opt = document.createElement('option');
              opt.value = item.row;
              opt.textContent = item.barang;
              selectBD.appendChild(opt);
            });
          }
        })
        .getBarangDipinjam(namaKaryawan);
    }

    function kirimDataPinjam() {
      let namaKaryawan = document.getElementById('selectKaryawan').value;
      let liniKaryawan = document.getElementById('txtLini').value;
      let barangDipinjam = document.getElementById('selectBarang').value;

      if(!namaKaryawan || !barangDipinjam) {
        alert("Mohon lengkapi nama karyawan dan barang yang dipilih!");
        return;
      }

      let payload = { namaKaryawan: namaKaryawan, liniKaryawan: liniKaryawan, barangDipinjam: barangDipinjam };
      google.script.run
        .withSuccessHandler(function(res) {
          alert("Peminjaman berhasil dicatat!");
          document.getElementById('selectKaryawan').value = "";
          document.getElementById('txtLini').value = "";
          document.getElementById('selectBarang').innerHTML = '<option value="">-- Pilih Karyawan Terlebih Dahulu --</option>';
        })
        .simpanPeminjaman(payload);
    }

    function prosesKembali() {
      let rowNum = document.getElementById('selectBarangDipinjam').value;
      if(!rowNum) {
        alert("Pilih barang yang akan dikembalikan terlebih dahulu!");
        return;
      }

      google.script.run
        .withSuccessHandler(function(res) {
          alert("Barang berhasil dikembalikan!");
          document.getElementById('selectKaryawanKembali').value = "";
          document.getElementById('selectBarangDipinjam').innerHTML = '<option value="">-- Pilih Karyawan Terlebih Dahulu --</option>';
        })
        .prosesPengembalian(rowNum);
    }
  </script>
</body>
</html>
